name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Tests
        run: python -m pytest -q
      - name: Every page renders without a terminal (real collectors and demo data)
        run: |
          for page in pulse system ai advanced net; do
            lmon --once --page "$page" --width 120 --height 35 > /dev/null
            lmon --demo --once --page "$page" --width 120 --height 35 > /dev/null
          done
      - name: Package builds
        run: python -m pip wheel . --no-deps -w dist
